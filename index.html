<div class="app" id="app">
  <header class="topbar">
    <button class="tool-btn tool-btn--icon hamb" id="menuBtn" aria-label="منو">☰</button>

      <button class="nav__item" data-tab="Practice">⌨ <span>تمرین</span></button>
      <button class="nav__item" data-tab="Cheatsheets">📄 <span>برگه‌های مرجع</span></button>
      <button class="nav__item" data-tab="Challenges">🏆 <span>چالش‌ها</span></button>
      <button class="nav__item" data-tab="Progress">📊 <span>پیشرفت</span></button>
    </nav>
    <div class="topbar__tools">
      <button class="search" id="searchBtn"><span>🔍</span><span class="search__hint">جستجو در مباحث، الگوریتم‌ها...</span><kbd>Ctrl K</kbd></button>
      <button class="tool-btn" id="langBtn">🌐 FA ▾</button>
      <button class="tool-btn tool-btn--icon" id="themeBtn" aria-label="تغییر تم">🌙</button>
      <div class="author"><div class="author__mark">𝕏</div><div class="author__text"><small>طراحی‌شده توسط</small><b><span>@DilumSanjaya</span></b></div></div>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar">
      <div class="sidebar__head"><span>📁</span><h2>دوره</h2><span>۸۶ درس</span></div>

    </aside>

    <main class="lesson">
      <div class="lesson__head">
        <h1 id="lessonTitle">Big-O Notation</h1>
        <div class="trail"><div class="trail__text"><div class="trail__chapter"><span class="trail__num" id="trailNum">01</span> <span id="trailChapter">Foundations</span></div><div class="trail__lesson" id="trailLesson">LESSON 1 OF 4</div></div>
        <svg width="72" height="42" viewBox="0 0 72 42"><g><rect x="2" y="26" width="18" height="10" rx="2" fill="#fff" stroke="#2a2b2f"/><rect x="20" y="18" width="18" height="10" rx="2" fill="#f7cec0" stroke="#2a2b2f"/><rect x="38" y="10" width="18" height="10" rx="2" fill="#e2705a" stroke="#2a2b2f"/><rect x="52" y="2" width="18" height="10" rx="2" fill="#fff" stroke="#2a2b2f"/></g></svg>

 if(title==="Recursion") return [

// Tree render
function renderTree(){
  const tree=document.getElementById('tree'); tree.innerHTML='';
  CHAPTERS.forEach((ch,ci)=>{
    const div=document.createElement('div'); div.className='tree__chapter'+(ci===0?' is-open':'')+(ci===currentChapterIdx?' is-current':'');
    const btn=document.createElement('button'); btn.className='tree__row'; btn.innerHTML=`<span class="tree__caret">›</span><span class="tree__folder">${ci===currentChapterIdx?'🟧':'📁'}</span><span class="tree__title">${String(ci+1).padStart(2,'0')}. ${ch.title}</span><span class="tree__count">0/${ch.lessons.length}</span>`;
    btn.onclick=()=>{div.classList.toggle('is-open')};
    div.appendChild(btn);
    const ul=document.createElement('ul'); ul.className='tree__lessons';
    ch.lessons.forEach((ls,li)=>{
      const item=document.createElement('li'); const a=document.createElement('button'); a.className='tree__lesson'+(ls===currentLesson?' is-active':''); a.innerHTML=`<span>📄</span><span>${ls}</span>`; a.onclick=()=>{selectLesson(ci,li,ls)}; item.appendChild(a); ul.appendChild(item);
    });
    div.appendChild(ul); tree.appendChild(div);
  });
}
function selectLesson(ci,li,title){
  // Only foundations have full content; others show toast + still switch title with generic BigO steps as placeholder lesson preview
  currentChapterIdx=ci; currentLessonIdx=li; currentLesson=title; stepIdx=0;
  if(!["Big-O Notation","Memory & Pointers","Recursion","Divide & Conquer"].includes(title)){
    // create a generic lesson using BigO steps but retitled - keep honest: show coming content via same step engine with note
    showToast(`در حال باز کردن ${title} — پیش‌نمایش این درس با همان گام‌های Big-O نمایش داده می‌شود`);

  document.getElementById('app').classList.remove('is-menu-open');
  renderAll();
}
function showToast(msg){const t=document.getElementById('toast');document.getElementById('toastText').textContent=msg;t.classList.add('is-on');setTimeout(()=>t.classList.remove('is-on'),2600)}

// Isometric scene
function isoBlock(cx,cy,w,h,label,steps,dim,active){
  const hw=w/2, hd=w*0.28;
  const topY=cy-h;
  const top=`${cx},${topY-hd} ${cx+hw},${topY} ${cx},${topY+hd} ${cx-hw},${topY}`;
  const left=`${cx-hw},${topY} ${cx},${topY+hd} ${cx},${topY+hd+h} ${cx-hw},${topY+h}`;
  const right=`${cx},${topY+hd} ${cx+hw},${topY} ${cx+hw},${topY+h} ${cx},${topY+hd+h}`;
  // small cubes on top
  let cubes=''; const cols=Math.min(4, Math.max(1, Math.ceil(Math.sqrt(Math.min(steps,16))))); const rows=Math.ceil(Math.min(steps,16)/cols);
  let idx=0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ if(idx>=Math.min(steps,16)) break; const ox=(c-(cols-1)/2)*22 + (r-(rows-1)/2)*10; const oy=(r-(rows-1)/2)*8 - (c-(cols-1)/2)*4; const sx=cx+ox, sy=topY-6+oy; cubes+=`<g transform="translate(${sx},${sy})"><polygon points="0,-7 10,0 0,7 -10,0" fill="#fff" stroke="#2a2b2f" stroke-width="1.2"/><polygon points="-10,0 0,7 0,14 -10,7" fill="#f2eee7" stroke="#2a2b2f" stroke-width="1"/><polygon points="0,7 10,0 10,7 0,14" fill="#e2705a" opacity="0.9" stroke="#2a2b2f" stroke-width="1"/></g>`; idx++; }
  const opacity=dim?0.28:1;
  const topFill=active?'#f3bcae':'#faf8f3';
  return `<g opacity="${opacity}">
    <polygon points="${left}" fill="#2a2b2f" stroke="#2a2b2f" stroke-width="1.5"/>
    <polygon points="${right}" fill="#f3a08c" stroke="#2a2b2f" stroke-width="1.2"/>
    <defs><pattern id="hatch-${label.replace(/[^a-z]/gi,'')}" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fbe2d8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#e2705a" stroke-width="3"/></pattern></defs>
    <polygon points="${right}" fill="url(#hatch-${label.replace(/[^a-z]/gi,'')})" opacity="0.85"/>
    <polygon points="${top}" fill="${topFill}" stroke="#2a2b2f" stroke-width="1.6"/>
    ${cubes}
    <text x="${cx-hw+14}" y="${topY+hd+h/2}" fill="#fff" font-size="15" font-weight="700" font-family="Inter">${label}</text>
    <g transform="translate(${cx+hw+12},${topY+hd+h/2-13})"><rect width="74" height="26" rx="7" fill="#2a2b2f"/><text x="37" y="17" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">${steps} گام</text></g>
  </g>`;
}
function renderScene(){
  const steps=getSteps(); const st=steps[stepIdx].state||{n:2}; const n=st.n||2; const focus=st.focus||null;
  const s1=1, sLog=Math.max(1,Math.round(Math.log2(n))), sLin=n, sQuad=n*n;
  const blocks=[
    {id:"one",label:"O(1)",steps:s1,cx:210,cy:330,w:110,h:52},
    {id:"log",label:"O(log n)",steps:sLog,cx:340,cy:265,w:120,h:62},
    {id:"lin",label:"O(n)",steps:sLin,cx:475,cy:195,w:130,h:72},
    {id:"quad",label:"O(n²)",steps:sQuad,cx:610,cy:115,w:145,h:88},
  ];
  // grid background
  let grid=''; for(let i=-10;i<22;i++){ grid+=`<path d="M ${i*36} 0 L ${i*36+220} 110" stroke="var(--grid-line)" stroke-width="1" fill="none" opacity="0.7"/><path d="M ${i*36} 456 L ${i*36+220} 346" stroke="var(--grid-line)" stroke-width="1" fill="none" opacity="0.5"/>`; }
  // Actually draw diamond grid via pattern lines simpler: use two sets
  let lines=''; for(let x=-400;x<900;x+=28){ lines+=`<line x1="${x}" y1="0" x2="${x+228}" y2="456" stroke="#d2cabd" stroke-width="0.7" opacity="0.6"/><line x1="${x+228}" y1="0" x2="${x}" y2="456" stroke="#d2cabd" stroke-width="0.7" opacity="0.6"/>`; }
  const svg=`<svg viewBox="0 0 760 456" preserveAspectRatio="xMidYMid meet" role="img" aria-label="نمودار ایزومتریک رشد مقدار کار">
    <rect width="760" height="456" fill="transparent"/>${lines}
    ${blocks.map(b=>isoBlock(b.cx,b.cy,b.w,b.h,b.label,b.steps, focus&&focus!==b.id, focus===b.id)).join('')}
    <g><rect x="335" y="18" width="86" height="36" rx="8" fill="#e2705a"/><text x="378" y="41" text-anchor="middle" fill="#fff" font-size="16" font-weight="600">n = ${n}</text><line x1="395" y1="54" x2="585" y2="92" stroke="#e2705a" stroke-width="2"/><circle cx="585" cy="92" r="5" fill="#e2705a"/></g>
  </svg>`;
  document.getElementById('stage').innerHTML=svg;
}
function renderStepCard(){
  const steps=getSteps(); const s=steps[stepIdx];
  const nextLabel= stepIdx<steps.length-1 ? steps[stepIdx+1].label : "پایان درس";
  document.getElementById('stepCard').innerHTML=`
    <div class="step-card__head"><span>گام ${stepIdx+1} از ${steps.length}</span><span class="chip--tag">${s.kind}</span></div>
    <h2>${s.label}</h2>
    <div class="step-card__body">${s.body.map(p=>`<p>${p}</p>`).join('')}</div>
    ${s.note?`<div class="note"><div class="note__icon">💡</div><div><b>${s.note.title}</b><p>${s.note.text}</p></div></div>`:''}
    <div class="step-card__nav"><button class="btn" id="backBtn" ${stepIdx===0?'disabled':''}>→ قبلی</button><button class="btn btn--primary" id="nextBtn">${stepIdx<steps.length-1?`بعدی: ${nextLabel}`:'✓ پایان درس'} ←</button></div>
  `;
  document.getElementById('backBtn').onclick=()=>{ if(stepIdx>0){stepIdx--; renderAll();} };
  document.getElementById('nextBtn').onclick=()=>{ if(stepIdx<steps.length-1){stepIdx++; renderAll();} else { doneSet.add(currentLesson); document.getElementById('progBar').style.width=(doneSet.size/86*100)+'%'; document.getElementById('progCount').textContent=`${doneSet.size} / 86`; showToast(`درس تمام شد — ${currentLesson}`);} };
}
function renderCode(){
  const lines=getPseudo().split('\n'); const steps=getSteps(); const focusLines=steps[stepIdx].lines||[];
  const box=document.getElementById('codeBox'); box.className='code'+(focusLines.length?' has-focus':'');
  box.innerHTML=lines.map((ln,i)=>{
    const num=i+1; const isF=focusLines.includes(num);
    let html=ln.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    html=html.replace(/\b(return|repeat|for|each|if)\b/g,'<span class="tok-kw">$1</span>');
    // indent via spaces count
    const indent=(ln.match(/^ */)[0].length)/4;
    return `<div class="code__line ${isF?'is-focus':''}" style="--indent:${indent}"><i>${num}</i><span>${html||' '}</span></div>`;
  }).join('');
}
function renderFacts(){
  const f=getSteps()[stepIdx].facts; const el=document.getElementById('factsCard');
  if(!f){el.innerHTML=''; return;}
  el.innerHTML=`<div class="card__title">${f.title}</div><dl>${(f.rows||[]).map(r=>`<div class="${r.active?'is-active':''}"><dt>${r.label}${r.detail?`<small>${r.detail}</small>`:''}</dt><dd><span class="chip">${r.value}</span></dd></div>`).join('')}</dl>${f.note?`<p class="facts-card__note">${f.note}</p>`:''}`;
}
function renderStepsRail(){
  const steps=getSteps(); const rail=document.getElementById('stepsRail'); rail.innerHTML='';
  steps.forEach((s,i)=>{
    const b=document.createElement('button'); b.className='steps__item'+(i===stepIdx?' is-current':'')+(i<stepIdx?' is-done':''); b.innerHTML=`<span class="steps__num">${i<stepIdx?'✓':i+1}</span><span class="steps__label">${s.label}</span>`; b.onclick=()=>{stepIdx=i; renderAll();}; rail.appendChild(b);
  });
  document.getElementById('stepPos').textContent=`گام ${stepIdx+1} از ${steps.length}`;
}
function renderAll(){
  document.getElementById('lessonTitle').textContent=currentLesson;
  document.getElementById('trailChapter').textContent=CHAPTERS[currentChapterIdx].title;
  document.getElementById('trailNum').textContent=String(currentChapterIdx+1).padStart(2,'0');
  document.getElementById('trailLesson').textContent=`درس ${currentLessonIdx+1} از ${CHAPTERS[currentChapterIdx].lessons.length}`;
  renderTree(); renderScene(); renderStepCard(); renderCode(); renderFacts(); renderStepsRail();
}
// Nav tabs
document.querySelectorAll('.nav__item').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav__item').forEach(x=>x.classList.remove('is-active')); b.classList.add('is-active'); if(b.dataset.tab!=='Learn') showToast(`${b.textContent.trim()} — در نسخه‌ی اصلی این بخش نمای خودش را باز می‌کند؛ اینجا درس یادگیری نمایش داده می‌شود`);});
// Theme
document.getElementById('themeBtn').onclick=()=>{const cur=document.documentElement.dataset.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=cur; document.getElementById('themeBtn').textContent=cur==='dark'?'☀️':'🌙'; renderScene();};
if(matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.dataset.theme='dark'; document.getElementById('themeBtn').textContent='☀️';}
// Menu
document.getElementById('menuBtn').onclick=()=>document.getElementById('app').classList.toggle('is-menu-open');
// Finder
const allLessons=CHAPTERS.flatMap((c,ci)=>c.lessons.map((t,li)=>({t,ci,li,chapter:c.title})));
function openFinder(){document.getElementById('finder').hidden=false; document.getElementById('finderInput').value=''; renderFinder(''); setTimeout(()=>document.getElementById('finderInput').focus(),30);}
function renderFinder(q){
  const list=document.getElementById('finderList'); const filtered=allLessons.filter(x=>x.t.toLowerCase().includes(q.toLowerCase()));
  document.getElementById('finderCount').textContent=`${filtered.length} درس`;
  list.innerHTML=filtered.slice(0,30).map((x,i)=>`<button class="finder__row ${i===0?'is-selected':''}" data-ci="${x.ci}" data-li="${x.li}" data-t="${x.t}"><span style="width:34px;height:34px;border:1px solid var(--line-strong);border-radius:8px;display:grid;place-items:center;background:var(--paper)">📄</span><span style="flex:1"><b style="display:block;font-size:14.5px">${x.t}</b><small style="color:var(--ink-3)">${x.chapter}</small></span><span style="color:var(--ink-3);font-size:12px">${String(x.ci+1).padStart(2,'0')} · ${x.li+1}</span></button>`).join('')||`<div style="text-align:center;padding:40px;color:var(--ink-3)"><b style="color:var(--ink)">درسی پیدا نشد</b><br>«binary search» یا «hash» را امتحان کن.</div>`;
  list.querySelectorAll('.finder__row').forEach(r=>r.onclick=()=>{document.getElementById('finder').hidden=true; selectLesson(+r.dataset.ci,+r.dataset.li,r.dataset.t);});
}
document.getElementById('searchBtn').onclick=openFinder;
document.getElementById('finderInput').addEventListener('input',e=>renderFinder(e.target.value));
document.getElementById('finder').addEventListener('click',e=>{if(e.target.id==='finder') e.target.hidden=true;});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault(); openFinder();}
  if(e.key==='Escape'){document.getElementById('finder').hidden=true; document.getElementById('langs').hidden=true;}
  if(!document.getElementById('finder').hidden) return;
  if(e.key==='ArrowRight' && stepIdx<getSteps().length-1){stepIdx++; renderAll();}
  if(e.key==='ArrowLeft' && stepIdx>0){stepIdx--; renderAll();}
});
// Langs
const LANGS=[["FA","فارسی — Persian"],["EN","English"],["ES","Español"],["FR","Français"],["DE","Deutsch"],["JA","日本語"],["KO","한국어"],["ZH","中文"]];
document.getElementById('langBtn').onclick=()=>{const p=document.getElementById('langs'); p.hidden=!p.hidden; document.getElementById('langList').innerHTML=LANGS.map(([c,n])=>`<button class="finder__row ${c==='FA'?'is-selected':''}" style="min-height:46px"><span style="width:32px;height:32px;border:1px solid var(--line-strong);border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700">${c}</span><span style="flex:1"><b>${n}</b></span>${c==='FA'?'✓':''}</button>`).join(''); document.getElementById('langList').querySelectorAll('button').forEach(b=>b.onclick=()=>{document.getElementById('langs').hidden=true; showToast('زبان این نسخه فارسی است — نسخه‌ی اصلی بیش از ۲۰ زبان دارد');});};
document.getElementById('langs').addEventListener('click',e=>{if(e.target.id==='langs') e.target.hidden=true;});
renderAll();
</script>
